        presets=presets.filter(x=>x.id!==p.id);
        if(activePresetId===p.id)activePresetId=null;
        saveState();renderPresets();toast('已删除');
      }
    });
  }

  return el;
}

function applyPreset(p){
  const d=JSON.parse(JSON.stringify(p.data));
  state.gradient={...state.gradient,...d.gradient};
  state.gradient.type='mesh';
  activePresetId=p.id;
  editingMesh=false;
  refreshUI();
  renderPresets();
  saveState();
  toast('已应用：'+p.name);
}

function openRenameModal(id){
  renamingPresetId=id;
  const p=presets.find(x=>x.id===id);
  if(!p)return;
  $('renameTitle').textContent='重命名预设';
  $('renameInput').value=p.name;
  $('renameModal').classList.add('show');
  setTimeout(()=>$('renameInput').focus(),50);
}

function closeRenameModal(){
  $('renameModal').classList.remove('show');
  renamingPresetId=null;
}

function saveRename(){
  const name=$('renameInput').value.trim();
  if(!name){toast('名称不能为空');return;}
  const p=presets.find(x=>x.id===renamingPresetId);
  if(!p)return;
  p.name=name;
  saveState();
  renderPresets();
  closeRenameModal();
  toast('已重命名');
}

/* ============ UI 刷新 ============ */
function refreshUI(){
  const g=state.gradient;

  $('flow').checked=g.flow;
  $('flowSpeed').value=g.flowSpeed; $('flowSpeedVal').textContent=g.flowSpeed.toFixed(2);
  $('turbulence').value=g.turbulence; $('turbulenceVal').textContent=g.turbulence.toFixed(2);
  $('blend').value=g.blend; $('blendVal').textContent=g.blend.toFixed(2);
  $('noise').value=g.noise||0; $('noiseVal').textContent=g.noise||0;

  const editBtn=$('toggleEdit');
  if(editBtn){
    editBtn.textContent=editingMesh?'编辑中 · 拖拽色点位置':'点击编辑色点位置';
    editBtn.classList.toggle('active',editingMesh);
  }

  renderMesh();

  updateExportDropdownUI();

  $('footType').textContent='mesh';
  $('footColors').textContent=g.mesh.length;
  updateCode();

  // 同步在线预览控件
  syncOverlayUI();
}

function syncOverlayUI(){
  const ov=state.overlay||defaultState().overlay;
  const seg=$('overlaySeg');
  if(seg){
    [...seg.children].forEach(b=>{
      b.classList.toggle('active',b.dataset.mode===ov.mode);
    });
  }
  const textWrap=$('overlayTextWrap');
  const imageWrap=$('overlayImageWrap');
  const actions=$('overlayActions');
  if(textWrap)textWrap.style.display=ov.mode==='text'?'block':'none';
  if(imageWrap)imageWrap.style.display=ov.mode==='image'?'block':'none';
  if(actions)actions.style.display=ov.mode!=='none'?'flex':'none';

  const textArea=$('overlayText');
  if(textArea)textArea.value=ov.text||'';

  const fileName=$('overlayFileName');
  const uploadLabel=$('overlayUploadLabel');
  if(fileName)fileName.textContent=ov.imageData?'已上传图片':'未选择文件';
  if(uploadLabel)uploadLabel.textContent=ov.imageData?'替换界面图片':'上传界面图片';

  const toggleVis=$('overlayToggleVis');
  if(toggleVis)toggleVis.textContent=ov.hidden?'显示':'隐藏';

  const scaleField=$('overlayScaleField');
  const scaleInput=$('overlayScale');
  const scaleVal=$('overlayScaleVal');
  if(scaleField)scaleField.style.display=ov.mode!=='none'?'block':'none';
  if(scaleInput)scaleInput.value=Math.round((ov.scale||1)*100);
  if(scaleVal)scaleVal.textContent=Math.round((ov.scale||1)*100)+'%';
}

/* ============ Export dropdown UI sync ============ */
function updateExportDropdownUI(){
  const fmt=state.videoFormat||'mp4';
  const scale=state.exportScale;
  const dur=state.exportDuration;
  const loop=state.exportLoop||false;

  // Format buttons
  const segFmt=$('segFormat');
  if(segFmt){
    [...segFmt.children].forEach(b=>{
      b.classList.toggle('active',b.dataset.v===fmt);
    });
  }

  // Resolution buttons
  const resGrid=$('resGrid');
  if(resGrid){
    [...resGrid.children].forEach(b=>{
      b.classList.toggle('active',b.dataset.v===String(scale));
    });
  }

  // Duration buttons
  const durGrid=$('durGrid');
  if(durGrid){
    [...durGrid.children].forEach(b=>{
      b.classList.toggle('active',b.dataset.v===String(dur));
    });
  }

  // Loop toggle
  const loopToggle=$('loopToggle');
  if(loopToggle){
    loopToggle.dataset.active=String(loop);
    loopToggle.querySelector('.loop-text').textContent=loop?'开启':'关闭';
  }

  // Update big export button text
  const sz=SIZE_TABLE[scale];
  const fmtLabel=fmt==='webm'?'WEBM':'MP4';
  const durLabel=dur+'秒';
  const loopLabel=loop?' · 循环':'';
  const bigBtn=$('btnStartExport');
  if(bigBtn){
    bigBtn.textContent=`导出 ${fmtLabel} · ${sz?sz.label:'?'} · ${durLabel}${loopLabel}`;
  }

  // Hidden compat
  const sizeHint=$('sizeHint');
  if(sizeHint&&sz)sizeHint.textContent=sz.label;
  const durVal=$('durVal');
  if(durVal)durVal.textContent=dur+'s';
  const duration=$('duration');
  if(duration)duration.value=dur;
}

/* ============ Export dropdown toggle ============ */
function toggleExportDropdown(show){
  const dd=$('exportDropdown');
  if(show===undefined)show=!dd.classList.contains('show');
  dd.classList.toggle('show',show);
}

/* ============ Fullscreen toggle ============ */
function toggleFullscreen(force){
  let isFs;
  if(force===undefined){
    isFs=!document.body.classList.contains('fullscreen');
  } else {
    isFs=force;
  }
  document.body.classList.toggle('fullscreen',isFs);
  const enterIcon=document.querySelector('#btnFullscreen .icon-enter');
  const exitIcon=document.querySelector('#btnFullscreen .icon-exit');
  if(enterIcon&&exitIcon){
    enterIcon.style.display=isFs?'none':'';
    exitIcon.style.display=isFs?'':'none';
  }
  toast(isFs?'已进入全屏模式':'已退出全屏模式');
}

function setSeg(id,val){
  const el=$(id);
  if(!el)return;
  [...el.children].forEach(b=>b.classList.toggle('active',b.dataset.v===val));
}

function renderMesh(){
  const wrap=$('meshStops'); wrap.innerHTML='';
  state.gradient.mesh.forEach((p,i)=>{
    const row=document.createElement('div');
    row.className='stop-row'+(p.visible===false?' is-hidden':'');
    row.draggable=true;
    row.dataset.index=i;

    const opVal=Math.round((p.opacity!=null?p.opacity:1)*100);
    const hexVal=p.color.toUpperCase().replace('#','');

    row.innerHTML=`
      <div class="drag-handle" title="拖动重新排序">
        <svg viewBox="0 0 16 16" fill="currentColor">
          <circle cx="5" cy="3" r="1.2"/><circle cx="11" cy="3" r="1.2"/>
          <circle cx="5" cy="8" r="1.2"/><circle cx="11" cy="8" r="1.2"/>
          <circle cx="5" cy="13" r="1.2"/><circle cx="11" cy="13" r="1.2"/>
        </svg>
      </div>
      <div class="color-wrap">
        <div class="swatch" title="点击选择颜色">
          <div class="swatch-fill"></div>
        </div>
        <input type="text" class="hex-input" maxlength="7" value="${hexVal}" placeholder="FFFFFF">
      </div>
      <div class="opacity-wrap">
        <input type="number" class="opacity-input" min="0" max="100" value="${opVal}">
        <span class="opacity-pct">%</span>
      </div>
      <div class="actions">
        <button class="act-btn visibility${p.visible===false?' hidden':''}" title="${p.visible===false?'显示':'隐藏'}">
          <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
        <button class="act-btn danger remove" title="删除">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>`;

    const swatchFill=row.querySelector('.swatch-fill');
    const hexInput=row.querySelector('.hex-input');
    const opInput=row.querySelector('.opacity-input');

    const applySwatch=()=>{
      const rgb=hexToRgb(p.color);
      const a=p.opacity!=null?p.opacity:1;
      swatchFill.style.backgroundColor=`rgba(${rgb.r},${rgb.g},${rgb.b},${a})`;
    };
    applySwatch();

    const swatch=row.querySelector('.swatch');
    swatch.addEventListener('mousedown',e=>e.stopPropagation());
    swatch.addEventListener('click',e=>{
      e.stopPropagation();
      showColorPicker(swatch,p.color,(newColor)=>{
        p.color=newColor;
        applySwatch();
        hexInput.value=p.color.toUpperCase().replace('#','');
        saveState();updateCode();
      });
    });

    hexInput.addEventListener('change',e=>{
      let v=e.target.value.trim().replace('#','');
      if(!/^[0-9a-fA-F]{6}$/.test(v)){hexInput.value=p.color.toUpperCase().replace('#','');return;}
      p.color='#'+v.toLowerCase();
      applySwatch();
      saveState();updateCode();
    });
    hexInput.addEventListener('keydown',e=>{
      if(e.key==='Enter'){e.target.blur();}
    });

    opInput.addEventListener('input',e=>{
      let v=parseInt(e.target.value)||0;
      v=Math.max(0,Math.min(100,v));
      p.opacity=v/100;
      applySwatch();
      saveState();updateCode();
    });

    const visBtn=row.querySelector('.visibility');
    const eyeOpen=visBtn.querySelector('.eye-open');
    const eyeClosed=visBtn.querySelector('.eye-closed');
    const updateVisBtn=()=>{
      const hidden=p.visible===false;
      visBtn.classList.toggle('hidden',hidden);
      visBtn.title=hidden?'显示':'隐藏';
      eyeOpen.style.display=hidden?'none':'';
      eyeClosed.style.display=hidden?'':'none';
      row.classList.toggle('is-hidden',hidden);
    };
    updateVisBtn();
    visBtn.addEventListener('click',()=>{
      p.visible=p.visible===false?true:false;
      if(p.visible===false)p._savedOpacity=p.opacity;
      else if(p._savedOpacity!=null){p.opacity=p._savedOpacity;delete p._savedOpacity;}
      updateVisBtn();
      opInput.value=Math.round((p.opacity!=null?p.opacity:1)*100);
      applySwatch();
      saveState();updateCode();
    });

    row.querySelector('.remove').addEventListener('click',()=>{
      if(state.gradient.mesh.length<=2){toast('至少保留 2 个色点');return;}
      state.gradient.mesh.splice(i,1);refreshUI();saveState();
    });

    row.addEventListener('dragstart',e=>{
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain',String(i));
      try{e.dataTransfer.setDragImage(row,20,20);}catch(err){}
    });
    row.addEventListener('dragend',()=>{
      row.classList.remove('dragging');
      document.querySelectorAll('.stop-row').forEach(r=>{
        r.classList.remove('drag-over-top','drag-over-bottom');
      });
    });
    row.addEventListener('dragover',e=>{
      e.preventDefault();
      e.dataTransfer.dropEffect='move';
      const rect=row.getBoundingClientRect();
      const above=(e.clientY-rect.top)<rect.height/2;
      row.classList.toggle('drag-over-top',above);
      row.classList.toggle('drag-over-bottom',!above);
    });
    row.addEventListener('dragleave',()=>{
      row.classList.remove('drag-over-top','drag-over-bottom');
    });
    row.addEventListener('drop',e=>{
      e.preventDefault();
      row.classList.remove('drag-over-top','drag-over-bottom');
      const fromIdx=parseInt(e.dataTransfer.getData('text/plain'));
      const toIdx=parseInt(row.dataset.index);
      if(fromIdx===toIdx)return;
      const rect=row.getBoundingClientRect();
      const above=(e.clientY-rect.top)<rect.height/2;
      const insertAt=above?toIdx:toIdx+1;
      const m=state.gradient.mesh;
      const [moved]=m.splice(fromIdx,1);
      m.splice(insertAt,0,moved);
      renderMesh();saveState();updateCode();
    });

    wrap.appendChild(row);
  });
}

/* ============ 事件绑定 ============ */
function bindEvents(){
  $('flow').addEventListener('change',e=>{state.gradient.flow=e.target.checked;saveState();});
  $('flowSpeed').addEventListener('input',e=>{state.gradient.flowSpeed=+e.target.value;$('flowSpeedVal').textContent=(+e.target.value).toFixed(2);updateCode();saveState();});
  $('turbulence').addEventListener('input',e=>{state.gradient.turbulence=+e.target.value;$('turbulenceVal').textContent=(+e.target.value).toFixed(2);updateCode();saveState();});
  $('blend').addEventListener('input',e=>{state.gradient.blend=+e.target.value;$('blendVal').textContent=(+e.target.value).toFixed(2);updateCode();saveState();});
  $('noise').addEventListener('input',e=>{state.gradient.noise=+e.target.value;$('noiseVal').textContent=+e.target.value;updateCode();saveState();});

  $('addMesh').addEventListener('click',()=>{
    if(state.gradient.mesh.length>=8){toast('最多 8 个色点');return;}
    state.gradient.mesh.push({x:0.5,y:0.5,color:'#ffffff',opacity:1,visible:true});
    refreshUI();saveState();
  });

  $('toggleEdit').addEventListener('click',()=>{
    editingMesh=!editingMesh;
    const btn=$('toggleEdit');
    btn.textContent=editingMesh?'编辑中 · 拖拽色点位置':'点击编辑色点位置';
    btn.classList.toggle('active',editingMesh);
  });

  function canvasPos(e){
    const r=canvas.getBoundingClientRect();
    const sx=canvas.width/r.width, sy=canvas.height/r.height;
    return {x:(e.clientX-r.left)*sx, y:(e.clientY-r.top)*sy};
  }
  canvas.addEventListener('mousedown',e=>{
    if(!editingMesh)return;
    const {x,y}=canvasPos(e);
    let bi=-1,bd=1e9;
    state.gradient.mesh.forEach((p,i)=>{
      const dx=p.x*canvas.width-x, dy=p.y*canvas.height-y;
      const d=Math.hypot(dx,dy);
      if(d<bd){bd=d;bi=i;}
    });
    if(bd<50){dragIdx=bi;}
  });
  window.addEventListener('mousemove',e=>{
    if(dragIdx<0)return;
    const {x,y}=canvasPos(e);
    state.gradient.mesh[dragIdx].x=clamp(x/canvas.width,0,1);
    state.gradient.mesh[dragIdx].y=clamp(y/canvas.height,0,1);
    renderMesh();saveState();updateCode();
  });
  window.addEventListener('mouseup',()=>{dragIdx=-1;});

  // Top bar buttons
  $('btnReset').addEventListener('click',()=>{
    state=defaultState();activePresetId=null;editingMesh=false;
    saveState();renderPresets();refreshUI();
    toast('已重置');
  });

  $('btnFullscreen').addEventListener('click',()=>{
    toggleFullscreen();
  });

  $('btnDownloadPng').addEventListener('click',async ()=>{
    // 在用户手势内先弹出保存位置，避免录制/生成完成后被浏览器拦截
    const handle=await requestSaveHandle(`gradient-${Date.now()}.png`);
    if(handle===false){pendingSaveHandle=null;return;} // 用户取消
    pendingSaveHandle=handle||null;
    checkOverlayBeforeExport(()=>exportPng());
  });

  $('btnShare').addEventListener('click',()=>{
    copyUrlToClipboard();
  });

  $('btnExport').addEventListener('click',(e)=>{
    e.stopPropagation();
    toggleExportDropdown();
  });

  $('btnCopyCode').addEventListener('click',()=>copyCode(state.codeTab));
  $('btnCopy2').addEventListener('click',()=>copyCode(state.codeTab));

  // Export dropdown format
  const segFmt=$('segFormat');
  if(segFmt){
    [...segFmt.children].forEach(b=>b.addEventListener('click',()=>{
      state.videoFormat=b.dataset.v;
      updateExportDropdownUI();saveState();
    }));
  }

  // Resolution grid
  const resGrid=$('resGrid');
  if(resGrid){
    [...resGrid.children].forEach(b=>b.addEventListener('click',()=>{
      state.exportScale=+b.dataset.v;
      updateExportDropdownUI();saveState();
    }));
  }

  // Duration grid
  const durGrid=$('durGrid');
  if(durGrid){
    [...durGrid.children].forEach(b=>b.addEventListener('click',()=>{
      state.exportDuration=+b.dataset.v;
      updateExportDropdownUI();saveState();
    }));
  }

  // Loop toggle
  const loopToggle=$('loopToggle');
  if(loopToggle){
    loopToggle.addEventListener('click',()=>{
      state.exportLoop=!state.exportLoop;
      updateExportDropdownUI();saveState();
    });
  }

  // Big export button
  $('btnStartExport').addEventListener('click',async ()=>{
    toggleExportDropdown(false);
    // 在用户手势内先弹出保存位置（录制要数秒，事后弹窗会被浏览器拦截）
    const ext=state.videoFormat==='webm'?'webm':'mp4';
    const handle=await requestSaveHandle(`gradient-video-${Date.now()}.${ext}`);
    if(handle===false){pendingSaveHandle=null;return;} // 用户取消导出
    pendingSaveHandle=handle||null;
    if(handle){
      // 明确提示流程：文件位置已选定，渲染完成后会自动写入，避免用户误以为卡住
      toast('已选择保存位置，渲染完成后将自动写入该文件...');
    }
    const doExport=async ()=>{
      try{
        await exportMp4();
      }catch(e){
        console.error('导出失败:',e);
        // 编码/封装失败时，用户命名但未写入的占位文件已无意义，清理掉避免残留空视频
        await discardPendingHandle();
        toast('导出失败: '+(e&&e.message||e));
      }
    };
    checkOverlayBeforeExport(doExport);
  });

  // Close dropdown when clicking outside
  document.addEventListener('click',(e)=>{
    const dd=$('exportDropdown');
    if(dd.classList.contains('show')&&!dd.contains(e.target)&&e.target.id!=='btnExport'){
      toggleExportDropdown(false);
    }
  });

  // Keyboard shortcuts
  document.addEventListener('keydown',(e)=>{
    // Shift+R: toggle fullscreen
    if((e.key==='r'||e.key==='R')&&e.shiftKey){
      e.preventDefault();
      toggleFullscreen();
      return;
    }
    // ESC: exit fullscreen or close dropdown / confirm modal
    if(e.key==='Escape'){
      if(document.body.classList.contains('fullscreen')){
        toggleFullscreen(false);
      }
      if($('exportDropdown').classList.contains('show')){
        toggleExportDropdown(false);
      }
      if($('confirmModal').classList.contains('show')){
        $('confirmModal').classList.remove('show');
        discardPendingHandle();
        pendingExportAction=null;
      }
    }
  });

  // Save current
  $('saveCurrent').addEventListener('click',()=>{
    savingCurrent=true;
    $('renameTitle').textContent='保存为新预设';
    $('renameInput').value='';
    $('renameModal').classList.add('show');
    setTimeout(()=>$('renameInput').focus(),50);
  });

  // Rename/save confirm
  $('renameCancel').addEventListener('click',()=>{
    $('renameModal').classList.remove('show');
    renamingPresetId=null;savingCurrent=false;
  });
  $('renameOk').addEventListener('click',()=>{
    if(savingCurrent){
      const name=$('renameInput').value.trim();
      if(!name){toast('名称不能为空');return;}
      const data=JSON.parse(JSON.stringify({gradient:state.gradient}));
      const np={
        id:genId(),
        name,
        builtin:false,
        data,
      };
      presets.push(np);
      activePresetId=np.id;
      saveState();renderPresets();
      toast('已保存预设：'+name);
      savingCurrent=false;
      $('renameModal').classList.remove('show');
      return;
    }
    saveRename();
  });
  $('renameInput').addEventListener('keydown',e=>{
    if(e.key==='Enter')$('renameOk').click();
    if(e.key==='Escape')$('renameCancel').click();
  });

  // Code bar tabs
  document.querySelectorAll('.code-tab').forEach(t=>{
    t.addEventListener('click',e=>{
      e.stopPropagation();
      document.querySelectorAll('.code-tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      state.codeTab=t.dataset.c;
      updateCode();saveState();
    });
  });
  $('codeHead').addEventListener('click',e=>{
    if(e.target.classList.contains('code-tab')||e.target.closest('.code-tab'))return;
    $('codeBar').classList.toggle('collapsed');
  });

  // Resize
  window.addEventListener('resize',resizeCanvas);

  /* ===== 在线预览事件 ===== */
  const seg=$('overlaySeg');
  if(seg){
    [...seg.children].forEach(b=>b.addEventListener('click',()=>{
      const mode=b.dataset.mode;
      if(state.overlay.mode===mode)return;
      state.overlay.mode=mode;
      syncOverlayUI();saveState();
    }));
  }
  const textArea=$('overlayText');
  if(textArea){
    textArea.addEventListener('input',e=>{
      state.overlay.text=e.target.value;
      saveState();
    });
  }
  const imgInput=$('overlayImageInput');
  if(imgInput){
    imgInput.addEventListener('change',e=>{
      const file=e.target.files[0];
      if(!file)return;
      const reader=new FileReader();
      reader.onload=ev=>{
        state.overlay.imageData=ev.target.result;
        preloadOverlayImage();
        syncOverlayUI();saveState();
        toast('图片已上传');
      };
      reader.readAsDataURL(file);
    });
  }
  const uploadBtn=$('overlayUploadBtn');
  if(uploadBtn){
    uploadBtn.addEventListener('click',()=>imgInput&&imgInput.click());
  }
  const toggleVis=$('overlayToggleVis');
  if(toggleVis){
    toggleVis.addEventListener('click',()=>{
      state.overlay.hidden=!state.overlay.hidden;
      syncOverlayUI();saveState();
    });
  }
  const closeOverlay=$('overlayClose');
  if(closeOverlay){
    closeOverlay.addEventListener('click',()=>{
      state.overlay.mode='none';
      state.overlay.hidden=false;
      syncOverlayUI();saveState();
    });
  }
  const scaleInput=$('overlayScale');
  if(scaleInput){
    scaleInput.addEventListener('input',e=>{
      const v=parseInt(e.target.value,10)||100;
      state.overlay.scale=v/100;
      const scaleVal=$('overlayScaleVal');
      if(scaleVal)scaleVal.textContent=v+'%';
      saveState();
    });
  }

  // 导出确认弹窗
  $('confirmYes').addEventListener('click',()=>{
    $('confirmModal').classList.remove('show');
    if(pendingExportAction)pendingExportAction();
    pendingExportAction=null;
  });
  $('confirmNo').addEventListener('click',()=>{
    $('confirmModal').classList.remove('show');
    discardPendingHandle();
    pendingExportAction=null;
  });
}

/* ============ 导出 PNG / MP4 / WEBM ============ */
let exporting=false;
let pendingExportAction=null;

function isOverlayActive(){
  const ov=state.overlay;
  return ov&&ov.mode!=='none'&&!ov.hidden;
}
function checkOverlayBeforeExport(action){
  if(isOverlayActive()){
    pendingExportAction=action;
    $('confirmModal').classList.add('show');
    return false;
  }
  action();
  return true;
}
function makeExportCanvas(){
  const sz=SIZE_TABLE[state.exportScale];
  const off=document.createElement('canvas');
  off.width=sz.w; off.height=sz.h;
  return off;
}
/* ============ 导出文件保存（绕过浏览器视频预览） ============ */
// 录制完成后再弹保存框会因“失去用户激活”被浏览器拒绝，
// 所以必须在用户点击导出的瞬间弹出保存对话框，录制完成后写入。
let pendingSaveHandle = null;

// 清理"用户已命名但从未写入内容"的占位文件（导出失败/取消时调用，避免残留空视频）
async function discardPendingHandle(){
  if(pendingSaveHandle){
    try{ await pendingSaveHandle.remove(); }catch(_){}
    pendingSaveHandle=null;
  }
}

// 在用户手势内请求保存位置。
// 返回: FileSystemFileHandle 成功; null 浏览器不支持(走传统下载); false 用户取消(中止导出)
// 注意：这里必须直接 await，不能加"超时兜底"——对话框打开期间用户改名保存的时长不受控制，
// 一旦超时先返回而用户之后又点了保存，磁盘上会留下用户命名的空占位文件，且 handle 已丢失，
// 渲染完成后再也写不进去（正是"导出空视频 + 又自动下载一个"bug 的根因）。
async function requestSaveHandle(filename){
  if(!window.showSaveFilePicker) return null;
  const ext=(filename.split('.').pop()||'').toLowerCase();
  const mimeMap={mp4:'video/mp4',webm:'video/webm',png:'image/png'};
  const mime=mimeMap[ext]||'application/octet-stream';
  try{
    return await window.showSaveFilePicker({
      suggestedName:filename,
      types:[{description:ext.toUpperCase()+' 文件',accept:{[mime]:['.'+ext]}}],
    });
  }catch(e){
    if(e&&e.name==='AbortError') return false; // 用户取消
    console.warn('showSaveFilePicker error:',e);
    return null;
  }
}

async function triggerDownload(blob, filename){
  // 1) 优先写入用户预先选择的保存位置
  if(pendingSaveHandle){
    const handle=pendingSaveHandle;
    pendingSaveHandle=null; // 先消费，避免异常/失败后残留
    try{
      const writable=await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      return 'saved'; // 已写入用户指定位置
    }catch(err){
      console.warn('写入指定位置失败, 回退浏览器下载:',err);
      // 用户选择的文件已由系统创建（空的），写入失败会留下"空视频"——
      // 尝试删除占位文件，避免用户磁盘上残留一个打不开的命名空文件
      try{ await handle.remove(); }catch(_){}
      toast('保存到指定位置失败，已改为浏览器下载');
    }
  }

  // 2) 兜底：传统 <a download> 触发下载（不打开视频预览）
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=filename;
  a.rel='noopener noreferrer';
  a.style.display='none';
  document.body.appendChild(a);
  a.click();
  // 注意：不能过早 revokeObjectURL —— 大文件（如 4K 视频几十 MB）下载未完成时
  // revoke 会中断下载，产生 0 字节文件。延迟 60s 再清理，确保下载完成。
  setTimeout(()=>{
    a.remove();
    URL.revokeObjectURL(url);
  },60000);
  return 'downloaded';
}

async function exportPng(){
  const sz=SIZE_TABLE[state.exportScale];
  const off=makeExportCanvas();
  const oc=off.getContext('2d');
  drawTo(oc,sz.w,sz.h,animTime);
  off.toBlob(async b=>{
    if(!b){toast('PNG 导出失败');return;}
    const mode=await triggerDownload(b, `gradient-${sz.w}x${sz.h}-${Date.now()}.png`);
    toast(mode==='saved'
      ? `PNG 已保存到指定位置 (${sz.w}×${sz.h})`
      : `PNG 已导出 (${sz.w}×${sz.h}) · 请在浏览器下载栏查看`);
  }, 'image/png');
}

async function exportMp4(){
  // 路由：MP4 优先走 WebCodecs 硬件编码（生成标准 moov 头 MP4，兼容所有播放器）
  const userFmt = state.videoFormat || 'mp4';
  if(userFmt === 'mp4' && typeof VideoEncoder !== 'undefined' && window.Mp4Muxer){
    try{
      await exportMp4WebCodecs();
      return;
    }catch(e){
      console.error('WebCodecs MP4 导出失败，回退 MediaRecorder:', e);
      toast('MP4 高质量编码失败，尝试兼容模式导出...');
    }
  }
  // ── 回退前能力检测：避免在旧浏览器上导出"打不开"的 MP4 ──
  if(userFmt === 'mp4'){
    if(!('MediaRecorder' in window)){
      toast('当前浏览器不支持视频录制，无法导出 MP4。建议使用最新版 Chrome / Edge');
      return;
    }
    const mp4Ok = [
      'video/mp4;codecs=h264','video/mp4;codecs=avc1','video/mp4;codecs=avc1.42E01E',
      'video/mp4;codecs=avc1.4D401E','video/mp4;codecs=avc1.640028','video/x-m4v','video/mp4',
    ].some(t => { try{ return MediaRecorder.isTypeSupported(t); }catch(_){ return false; } });
    if(!mp4Ok){
      toast('此浏览器无法录制 MP4（仅支持高质量 WebCodecs 编码）。请升级到 Chrome/Edge 91+，或改用 WEBM 格式');
      return;
    }
    toast('当前浏览器不支持高质量 MP4 编码，将尝试兼容模式导出（可能无法在部分播放器播放）...');
  }
  await exportViaMediaRecorder();
}

/* ==== MP4 导出（推荐路径）：WebCodecs H.264 逐帧编码 + mp4-muxer 封装 ==== */
async function exportMp4WebCodecs(){
  const sz = SIZE_TABLE[state.exportScale];
  const dur = state.exportDuration;
  const loop = state.exportLoop || false;
  const fps = 30;
  const totalFrames = Math.max(1, Math.round(dur * fps));
  const M = window.Mp4Muxer;

  // H.264 level 按分辨率选择：4K→5.1，1080p→4.0
  const is4K = sz.w * sz.h >= 3840 * 2000;
  const levelHex = is4K ? '33' : '28';
  const bitsPerPixel = is4K ? 6 : 4;
  const config = {
    codec: 'avc1.6400' + levelHex, // High Profile
    width: sz.w,
    height: sz.h,
    bitrate: Math.round(sz.w * sz.h * bitsPerPixel),
    framerate: fps,
    latencyMode: 'quality',
    avc: { format: 'avc' },
  };

  const support = await VideoEncoder.isConfigSupported(config);
  if(!support || !support.supported){
    throw new Error('当前浏览器不支持 H.264 ' + sz.label + ' 编码');
  }

  const target = new M.ArrayBufferTarget();
  const muxer = new M.Muxer({
    target,
    video: { codec: 'avc', width: sz.w, height: sz.h },
    fastStart: 'in-memory',
    firstTimestampBehavior: 'offset',
  });

  let encError = null;
  const encoder = new VideoEncoder({
    output: (chunk, meta) => {
      try{ muxer.addVideoChunk(chunk, meta); }
      catch(err){ if(!encError) encError = err; }
    },
    error: e => { if(!encError) encError = e; }
  });
  encoder.configure(config);

  const off = makeExportCanvas();
  const oc = off.getContext('2d');
  const loopTag = loop ? ' · 循环' : '';
  toast(`开始编码 ${dur}s MP4 @${fps}fps · ${sz.label}${loopTag}...`);

  exporting = true;
  let lastToastFrame = -1;
  try{
    for(let i = 0; i < totalFrames; i++){
      if(encError) throw encError;
      const progress = totalFrames === 1 ? 0 : i / (totalFrames - 1);
      const t = loop
        ? animTime + (1 - Math.cos(progress * 2 * Math.PI)) * 0.5 * dur
        : animTime + progress * dur;
      drawTo(oc, sz.w, sz.h, t);
      // 进度提示：每 5 帧更新一次，长视频（4K/10s）不再"干等"
      if(i - lastToastFrame >= 5 || i === totalFrames - 1){
        lastToastFrame = i;
        const pct = Math.round((i + 1) / totalFrames * 100);
        toast(`正在编码 MP4 ${pct}% · ${sz.label}${loopTag}...`);
      }
      const frame = new VideoFrame(off, {
        timestamp: Math.round(i * 1e6 / fps),
        duration: Math.round(1e6 / fps),
      });
      encoder.encode(frame, { keyFrame: i % fps === 0 });
      frame.close();
      // 背压控制：编码队列过深时等待，避免内存堆积
      if(encoder.encodeQueueSize > 4){
        await new Promise(r => encoder.addEventListener('dequeue', r, { once: true }));
      }
    }
    await encoder.flush();
    if(encError) throw encError;
    muxer.finalize();

    const blob = new Blob([target.buffer], { type: 'video/mp4' });
    if(blob.size < 10000){
      throw new Error('编码数据异常 (' + blob.size + ' bytes)');
    }

    const loopSuffix = loop ? '-loop' : '';
    const saveMode = await triggerDownload(blob, `gradient-${sz.w}x${sz.h}-${dur}s${loopSuffix}-${Date.now()}.mp4`);
    toast(saveMode === 'saved'
      ? `文件已保存到指定位置 (${sz.label}, ${dur}s${loopTag})`
      : `MP4 已导出 (${sz.label}, ${dur}s, ${fps}fps${loopTag}) · 请在浏览器下载栏查看`);
  } finally {
    try{ encoder.close(); }catch(_){}
    exporting = false;
  }
}

/* ==== WEBM 导出 / MP4 兜底：MediaRecorder 实时录制 ==== */
async function exportViaMediaRecorder(){
  if(!('MediaRecorder' in window)){toast('当前浏览器不支持录制视频');return;}
  const sz=SIZE_TABLE[state.exportScale];
  const off=makeExportCanvas();
  const oc=off.getContext('2d');
  const dur=state.exportDuration;
  const loop=state.exportLoop||false;

  // ==== 统一 30fps ====
  const fps = 30;
  const totalFrames = Math.max(1, Math.floor(dur * fps));
  const frameIntervalMs = 1000 / fps;

  // 根据用户选择的格式强制使用对应编码
  const userFmt = state.videoFormat || 'mp4';
  let mimeType, ext;

  if(userFmt === 'mp4'){
    const mp4Candidates = [
      'video/mp4;codecs=h264',
      'video/mp4;codecs=avc1',
      'video/mp4;codecs=avc1.42E01E',
      'video/mp4;codecs=avc1.4D401E',
      'video/mp4;codecs=avc1.640028',
      'video/x-m4v',
      'video/mp4',
    ];
    mimeType = '';
    for(const t of mp4Candidates){
      if(MediaRecorder.isTypeSupported(t)){
        mimeType = t;
        break;
      }
    }
    ext = 'mp4';
    if(!mimeType){
      if(MediaRecorder.isTypeSupported('video/mp4')){
        mimeType = 'video/mp4';
      } else {
        toast('当前浏览器不支持MP4编码，建议使用Chrome/Safari或改为WEBM格式');
        return;
      }
    }
  } else {
    mimeType = 'video/webm;codecs=vp9';
    ext = 'webm';
    if(!MediaRecorder.isTypeSupported(mimeType)){
      if(MediaRecorder.isTypeSupported('video/webm;codecs=vp8')){
        mimeType = 'video/webm;codecs=vp8';
      } else if(MediaRecorder.isTypeSupported('video/webm')){
        mimeType = 'video/webm';
      } else {
        toast('当前浏览器不支持WEBM编码');
        return;
      }
    }
  }

  try {
    const stream = off.captureStream(fps);
    const vt = stream.getVideoTracks()[0];
    const chunks = [];
    const totalPixels = sz.w * sz.h;
    const bitsPerPixel = totalPixels >= 3840*2000 ? 6 : 4;
    let rec;
    try {
      rec = new MediaRecorder(stream, {
        mimeType: mimeType,
        videoBitsPerSecond: sz.w * sz.h * bitsPerPixel,
      });
    } catch(e) {
      rec = new MediaRecorder(stream);
    }
    rec.ondataavailable = e => { if(e.data && e.data.size > 0) chunks.push(e.data); };

    const loopTag = loop ? ' · 循环' : '';
    toast(`开始录制 ${dur}s ${ext.toUpperCase()} @${fps}fps · ${sz.label}${loopTag}...`);

    // ==== 关键修复 1: 先画第一帧，确保 canvas 有内容 ====
    drawTo(oc, sz.w, sz.h, animTime);
    if(vt.requestFrame) vt.requestFrame();

    // ==== 关键修复 2: 给 canvas 一帧时间同步到 stream ====
    await new Promise(r => requestAnimationFrame(r));
    await new Promise(r => requestAnimationFrame(r));

    // ==== 关键修复 3: 启动录制（不指定 timeslice，让编码器自己决定）====
    rec.start();
    exporting = true;

    // ==== 关键修复 4: 等待录制器初始化 ====
    await new Promise(r => setTimeout(r, 200));

    // ==== 关键修复 5: 使用 rAF 循环驱动录制，确保每帧都被捕获 ====
    const progressDenom = Math.max(1, totalFrames - 1);
    let frameIndex = 0;
    let lastToastFrame = -1;
    const startTime = performance.now();

    await new Promise((resolve) => {
      const renderFrame = () => {
        if(frameIndex >= totalFrames){
          resolve();
          return;
        }

        // 进度提示（每 5 帧更新一次）
        if(frameIndex - lastToastFrame >= 5 || frameIndex === totalFrames - 1){
          lastToastFrame = frameIndex;
          const pct = Math.round(Math.min(frameIndex + 1, totalFrames) / totalFrames * 100);
          toast(`正在录制 ${ext.toUpperCase()} ${pct}% · ${sz.label}${loopTag}...`);
        }

        const progress = frameIndex / progressDenom;
        let t;
        if(loop){
          t = animTime + (1 - Math.cos(progress * 2 * Math.PI)) * 0.5 * dur;
        } else {
          t = animTime + progress * dur;
        }

        drawTo(oc, sz.w, sz.h, t);
        if(vt.requestFrame) vt.requestFrame();

        frameIndex++;

        // 计算下一帧的目标时间
        const elapsed = performance.now() - startTime;
        const targetElapsed = frameIndex * frameIntervalMs;
        const delay = targetElapsed - elapsed;

        if(delay > 0){
          setTimeout(renderFrame, delay);
        } else {
          requestAnimationFrame(renderFrame);
        }
      };
      renderFrame();
    });

    // ==== 关键修复 6: 画最后一帧并等待同步 ====
    const lastProgress = loop ? 0 : 1;
    const lastT = loop ? animTime : animTime + dur;
    drawTo(oc, sz.w, sz.h, lastT);
    if(vt.requestFrame) vt.requestFrame();
    await new Promise(r => requestAnimationFrame(r));
    await new Promise(r => requestAnimationFrame(r));

    // ==== 关键修复 7: 给编码器额外时间完成最后一帧 ====
    await new Promise(r => setTimeout(r, 300));

    // ==== 停止录制 ====
    const onStopPromise = new Promise(res => rec.onstop = () => res());
    rec.stop();
    await onStopPromise;
    exporting = false;

    // ==== 检查数据 ====
    if(chunks.length === 0 || chunks.every(c => c.size === 0)){
      await discardPendingHandle();
      toast('录制失败: 未捕获到视频数据');
      return;
    }

    const blob = new Blob(chunks, { type: mimeType.split(';')[0] });
    if(blob.size < 1000){
      await discardPendingHandle();
      toast('录制失败: 视频数据过小 (' + blob.size + ' bytes)');
      return;
    }

    const loopSuffix = loop ? '-loop' : '';
    const saveMode = await triggerDownload(blob, `gradient-${sz.w}x${sz.h}-${dur}s${loopSuffix}-${Date.now()}.${ext}`);
    toast(saveMode==='saved'
      ? `文件已保存到指定位置 (${sz.label}, ${dur}s${loopTag})`
      : `${ext.toUpperCase()} 已导出 (${sz.label}, ${dur}s, ${fps}fps${loopTag}) · 请在浏览器下载栏查看`);
  } catch(e) {
    exporting = false;
    await discardPendingHandle();
    toast('导出失败: ' + e.message);
    console.error(e);
  }
}

async function doExport(){
  if(exporting){toast('正在导出中...');return;}
  if(state.exportFormat==='png') await exportPng();
  else if(state.exportFormat==='webm' || state.exportFormat==='mp4') await exportMp4();
}

/* ============ 代码生成 ============ */
function updateCode(){
  const g=state.gradient;
  if(state.codeTab==='json'){
    $('codeOut').textContent=JSON.stringify(state,null,2);
  } else if(state.codeTab==='css'){
    $('codeOut').textContent=genCSS();
  } else {
    $('codeOut').textContent=genCanvas();
  }
}

function genCSS(){
  const g=state.gradient;
  const m=g.mesh.filter(p=>p.visible!==false);
  if(!m.length)return '/* 无可见色点 */';
  const bg=`radial-gradient(circle at ${(m[0].x*100).toFixed(0)}% ${(m[0].y*100).toFixed(0)}%, ${m[0].color}, transparent 50%)`;
  return `/* 渐变背景 */\nbackground: ${bg};`;
}

function genCanvas(){
  const g=state.gradient;
  let code=`// 渐变网格效果 - Canvas 绘制代码\nconst canvas = document.querySelector('canvas');\nconst ctx = canvas.getContext('2d');\nconst w = canvas.width, h = canvas.height;\n\n`;

    code += `// 网格渐变 (${g.mesh.length} 个色点)\n`;
    code += `const mesh = ${JSON.stringify(g.mesh,null,2)};\nconst blend = ${g.blend};\nconst noise = ${g.noise||0};\n\nctx.fillStyle = mesh[0].color;\nctx.fillRect(0, 0, w, h);\n\nmesh.forEach(p => {
  if (p.visible === false) return;
  const cx = p.x * w, cy = p.y * h;
  const rad = Math.max(1, Math.hypot(w, h) * blend);
  const op = p.opacity != null ? p.opacity : 1;
  const rg = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
  rg.addColorStop(0, p.color);
  rg.addColorStop(0.5, p.color + Math.round(op*128).toString(16).padStart(2,'0'));
  rg.addColorStop(1, p.color + '00');
  ctx.fillStyle = rg;
  ctx.fillRect(0, 0, w, h);
});
`;

  if(g.noise>0){
    code += `// 电影胶片噪点（静态）
if(noise > 0){
  const noiseCanvas = document.createElement('canvas');
  const ns = Math.max(w, h);
  noiseCanvas.width = ns;
  noiseCanvas.height = ns;
  const nctx = noiseCanvas.getContext('2d');
  const ndata = nctx.createImageData(ns, ns);
  for (let i = 0; i < ndata.data.length; i += 4) {
    const v = Math.random();
    const offset = (v - 0.5) * 255;
    ndata.data[i] = 128 + offset * 0.6;
    ndata.data[i+1] = 128 + offset * 0.6;
    ndata.data[i+2] = 128 + offset * 0.6;
    ndata.data[i+3] = 255;
  }
  nctx.putImageData(ndata, 0, 0);
  ctx.save();
  ctx.globalCompositeOperation = 'overlay';
  ctx.globalAlpha = noise / 100 * 0.7;
  ctx.drawImage(noiseCanvas, 0, 0, w, h);
  ctx.restore();
}
`;
  }

  return code;
}

function copyCode(tab){
  let txt;
  if(tab==='json') txt=JSON.stringify(state,null,2);
  else if(tab==='css') txt=genCSS();
  else txt=genCanvas();
  navigator.clipboard.writeText(txt).then(()=>toast('代码已复制')).catch(()=>toast('复制失败'));
}

/* ============ Toast ============ */
let toastTimer;
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}

/* ============ 画布尺寸 ============ */
function resizeCanvas(){
  const w=Math.floor(window.innerWidth*dpr);
  const h=Math.floor(window.innerHeight*dpr);
  canvas.style.width=window.innerWidth+'px';
  canvas.style.height=window.innerHeight+'px';
  canvas.width=w;
  canvas.height=h;
  $('footSize').textContent=w+'×'+h;
  invalidateNoise();
}

/* ============ 启动 ============ */
resizeCanvas();
init();
